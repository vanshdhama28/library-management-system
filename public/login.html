<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register - Library BookSlot System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Main Container -->
  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3 mb-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-sky-400 flex items-center justify-center text-white shadow-xl shadow-indigo-500/30">
          <i class="fa-solid fa-book-bookmark text-2xl"></i>
        </div>
      </a>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Welcome to BookSlot</h1>
      <p class="text-slate-400 text-xs mt-1">Manage library book availability & slot reservations</p>
    </div>

    <!-- Auth Card -->
    <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
      <!-- Quick Demo Account Quick-Fill Banner -->
      <div class="bg-indigo-950/60 border border-indigo-500/30 p-3 rounded-2xl mb-6 text-xs text-indigo-300">
        <p class="font-bold flex items-center gap-1.5 mb-2 text-indigo-200">
          <i class="fa-solid fa-key text-indigo-400"></i> Demo Accounts (1-Click Login):
        </p>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="quickLogin('admin@library.com', 'admin123')" 
            class="px-2.5 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-semibold transition text-left flex items-center justify-between">
            <span><i class="fa-solid fa-user-shield mr-1"></i> Admin</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
          </button>
          <button onclick="quickLogin('user@library.com', 'user123')" 
            class="px-2.5 py-1.5 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 text-indigo-300 font-semibold transition text-left flex items-center justify-between">
            <span><i class="fa-solid fa-user mr-1"></i> User</span>
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
          </button>
        </div>
      </div>

      <!-- Auth Tabs -->
      <div class="flex border-b border-slate-800 mb-6">
        <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-3 text-sm font-bold border-b-2 border-indigo-500 text-indigo-400 transition">
          Sign In
        </button>
        <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white transition">
          Register
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="email" id="login-email" required placeholder="user@library.com"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="password" id="login-password" required placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="reg-name" required placeholder="John Doe"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="email" id="reg-email" required placeholder="john@example.com"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="password" id="reg-password" required placeholder="At least 6 characters" minlength="6"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
          </div>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
          <span>Create Account</span>
          <i class="fa-solid fa-user-plus text-xs"></i>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-500 mt-6">
      <a href="/" class="hover:text-slate-300 transition flex items-center justify-center gap-1">
        <i class="fa-solid fa-arrow-left"></i> Back to Public Catalog
      </a>
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('tab') === 'register') {
        switchTab('register');
      }
    });

    function switchTab(tab) {
      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');

      if (tab === 'login') {
        loginTab.className = 'flex-1 py-3 text-sm font-bold border-b-2 border-indigo-500 text-indigo-400 transition';
        regTab.className = 'flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white transition';
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
      } else {
        regTab.className = 'flex-1 py-3 text-sm font-bold border-b-2 border-indigo-500 text-indigo-400 transition';
        loginTab.className = 'flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white transition';
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const data = await App.api('/auth/login', 'POST', { email, password });
        App.setToken(data.token);
        App.setUser(data.user);
        App.showToast(`Welcome back, ${data.user.name}!`, 'success');

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        }, 500);

      } catch (err) {
        App.showToast(err.message, 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const data = await App.api('/auth/register', 'POST', { name, email, password });
        App.setToken(data.token);
        App.setUser(data.user);
        App.showToast('Account created successfully!', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 500);

      } catch (err) {
        App.showToast(err.message, 'error');
      }
    }

    async function quickLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      const fakeEvent = { preventDefault: () => {} };
      await handleLogin(fakeEvent);
    }
  </script>
</body>
</html>
