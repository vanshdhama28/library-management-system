<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - My Bookings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Header / Nav -->
  <header class="sticky top-0 z-40 glass-nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-400 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-book-bookmark text-xl"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-white">BookSlot</span>
          <span class="text-xs block text-slate-400 font-medium">User Dashboard</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
        <a href="/" class="hover:text-indigo-400 transition flex items-center gap-2">
          <i class="fa-solid fa-compass"></i> Catalog & Slots
        </a>
        <a href="/dashboard.html" class="text-indigo-400 font-semibold flex items-center gap-2">
          <i class="fa-solid fa-user-check"></i> My Bookings
        </a>
      </nav>

      <div id="nav-right" class="flex items-center gap-3"></div>
    </div>
  </header>

  <!-- Dashboard Main Content -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    <!-- User Welcome Header -->
    <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800 mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
      <div class="flex items-center gap-4">
        <div id="user-avatar" class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-sky-500 flex items-center justify-center text-white font-extrabold text-2xl shadow-xl shadow-indigo-600/30">
          U
        </div>
        <div>
          <h1 id="user-name-display" class="text-2xl sm:text-3xl font-extrabold text-white">My Bookings</h1>
          <p id="user-email-display" class="text-xs sm:text-sm text-slate-400 mt-1">user@library.com</p>
        </div>
      </div>

      <a href="/" class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs sm:text-sm shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Reserve Another Book
      </a>
    </div>

    <!-- Quick Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
      <div class="glass-panel p-5 rounded-2xl border border-slate-800">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Bookings</span>
          <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
            <i class="fa-solid fa-bookmark"></i>
          </div>
        </div>
        <span id="stat-active" class="text-3xl font-extrabold text-white">0</span>
      </div>

      <div class="glass-panel p-5 rounded-2xl border border-slate-800">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Slots Reserved</span>
          <div class="w-8 h-8 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20">
            <i class="fa-solid fa-clock-rotate-left"></i>
          </div>
        </div>
        <span id="stat-total" class="text-3xl font-extrabold text-white">0</span>
      </div>

      <div class="glass-panel p-5 rounded-2xl border border-slate-800">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Account Status</span>
          <div class="w-8 h-8 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center border border-sky-500/20">
            <i class="fa-solid fa-user-shield"></i>
          </div>
        </div>
        <span id="stat-status" class="text-lg font-bold text-emerald-400">Active</span>
      </div>
    </div>

    <!-- My Bookings List Section -->
    <div class="glass-panel rounded-3xl border border-slate-800 overflow-hidden shadow-xl">
      <div class="p-6 border-b border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-list-check text-indigo-400"></i> My Reserved Book Slots
        </h2>

        <!-- Status Filter Tabs -->
        <div class="flex bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
          <button id="tab-active" onclick="filterMyBookings('active')" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 text-white transition shadow-sm">
            Active / Upcoming
          </button>
          <button id="tab-all" onclick="filterMyBookings('all')" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
            All History
          </button>
        </div>
      </div>

      <div id="my-bookings-container" class="p-6 space-y-4">
        <!-- Rendered dynamically -->
        <div class="py-12 text-center text-slate-400">
          <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-500 mb-3"></i>
          <p class="text-sm">Loading your bookings...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/user-dashboard.js"></script>
</body>
</html>
